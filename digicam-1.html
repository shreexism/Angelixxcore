<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGICAM // Filter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg: #0a0d0a;
    --panel: #12160f;
    --line: #2c352a;
    --lcd: #a6ff4d;
    --lcd-dim: #5c8f3a;
    --paper: #e7f0df;
    --red: #ff5b4d;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #151b12 0%, var(--bg) 60%);
    color: var(--paper);
    font-family:'Space Mono', monospace;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }

  .device{
    width:100%;
    max-width:460px;
  }

  /* --- top chrome --- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    letter-spacing:.08em;
    color: var(--lcd-dim);
    padding: 0 4px 10px;
  }
  .topbar .brand{
    font-family:'VT323', monospace;
    font-size: 28px;
    color: var(--lcd);
    letter-spacing:.04em;
    text-shadow: 0 0 8px rgba(166,255,77,.35);
  }
  .rec{
    display:flex; align-items:center; gap:6px;
  }
  .rec .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    animation: blink 1.4s infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }

  /* --- viewfinder --- */
  .viewfinder{
    position:relative;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding: 10px;
  }
  .screen{
    position:relative;
    aspect-ratio: 4/3;
    background:
      repeating-linear-gradient(0deg, rgba(166,255,77,.03) 0px, rgba(166,255,77,.03) 1px, transparent 1px, transparent 3px),
      #060a05;
    border-radius:2px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    max-width:100%;
    max-height:100%;
    display:block;
  }
  .empty-state{
    color: var(--lcd-dim);
    font-family:'VT323', monospace;
    font-size:20px;
    text-align:center;
    line-height:1.5;
    padding: 20px;
  }
  .empty-state .icon{
    font-size:40px;
    display:block;
    margin-bottom:6px;
    opacity:.6;
  }

  /* corner brackets */
  .bracket{ position:absolute; width:18px; height:18px; border-color:var(--lcd); opacity:.7; }
  .bracket.tl{ top:6px; left:6px; border-top:2px solid; border-left:2px solid; }
  .bracket.tr{ top:6px; right:6px; border-top:2px solid; border-right:2px solid; }
  .bracket.bl{ bottom:6px; left:6px; border-bottom:2px solid; border-left:2px solid; }
  .bracket.br{ bottom:6px; right:6px; border-bottom:2px solid; border-right:2px solid; }

  /* HUD overlay */
  .hud{
    position:absolute; inset:0;
    pointer-events:none;
    font-family:'VT323', monospace;
    color: var(--lcd);
    text-shadow: 0 0 4px rgba(166,255,77,.6);
  }
  .hud .stamp{
    position:absolute;
    bottom:8px; left:14px;
    font-size:16px;
    letter-spacing:.03em;
  }
  .hud .battery{
    position:absolute;
    top:8px; right:12px;
    font-size:15px;
    display:flex; align-items:center; gap:5px;
  }
  .hud .modeName{
    position:absolute;
    top:8px; left:12px;
    font-size:15px;
  }
  .batt-icon{ display:flex; align-items:center; gap:1px; }
  .batt-bar{ width:3px; height:8px; background: var(--lcd); }

  /* --- controls --- */
  .filename{
    text-align:center;
    font-size:11px;
    color: var(--lcd-dim);
    margin-top:8px;
    min-height:14px;
    letter-spacing:.05em;
  }

  .upload-row{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .upload-row > *{
    flex:1 1 0;
    min-width:0;
    width:auto;
  }
  .file-btn{
    position:relative;
    text-align:center;
  }
  .file-btn input{
    display:none;
  }

  button, .file-btn label{
    display:block;
    width:100%;
    background: var(--panel);
    border:1px solid var(--line);
    color: var(--paper);
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.06em;
    padding: 12px 10px;
    border-radius:3px;
    cursor:pointer;
    transition: border-color .15s, color .15s;
  }
  button:hover, .file-btn label:hover{
    border-color: var(--lcd);
    color: var(--lcd);
  }
  button:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  button.primary{
    color: var(--bg);
    background: var(--lcd);
    border-color: var(--lcd);
    font-weight:700;
  }
  button.primary:hover{ filter: brightness(1.08); }

  .dial-label{
    font-size:11px;
    color: var(--lcd-dim);
    letter-spacing:.14em;
    margin: 22px 0 8px 2px;
  }

  .dial{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
  }
  .dial button{
    font-size:11px;
    padding: 10px 4px;
    text-align:left;
    position:relative;
  }
  .dial button .num{
    display:block;
    font-family:'VT323', monospace;
    font-size:17px;
    color: var(--lcd-dim);
    margin-bottom:2px;
  }
  .dial button.active{
    border-color: var(--lcd);
    color: var(--lcd);
    background: #101a0c;
  }
  .dial button.active .num{ color: var(--lcd); }

  .actions{
    display:flex;
    gap:8px;
    margin-top:20px;
  }

  .footer-note{
    text-align:center;
    font-size:10px;
    color: var(--line);
    margin-top:22px;
    letter-spacing:.08em;
  }
</style>
</head>
<body>

<div class="device">

  <div class="topbar">
    <span class="brand">DIGICAM</span>
    <span class="rec"><span class="dot"></span> STANDBY</span>
  </div>

  <div class="viewfinder">
    <div class="screen" id="screen">
      <div class="empty-state" id="emptyState">
        <span class="icon">▢</span>
        NO CARD INSERTED<br>tap "load photo" below
      </div>
      <canvas id="canvas" style="display:none;"></canvas>

      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>

      <div class="hud" id="hud" style="display:none;">
        <div class="modeName" id="modeName">ORIGINAL</div>
        <div class="battery">
          <span class="batt-icon">
            <span class="batt-bar"></span><span class="batt-bar"></span><span class="batt-bar"></span>
          </span>
          98%
        </div>
        <div class="stamp" id="stamp">'99 12·25 14:32</div>
      </div>
    </div>
  </div>

  <div class="filename" id="filename">&nbsp;</div>

  <div class="upload-row">
    <div class="file-btn">
      <button id="loadBtn" type="button">▣ LOAD PHOTO</button>
      <input type="file" id="upload" accept="image/*">
    </div>
    <button id="downloadBtn" disabled>⬇ SAVE</button>
  </div>

  <div class="dial-label">FILTER DIAL — select a mode</div>
  <div class="dial" id="dial"></div>

  <div class="footer-note">DIGICAM FILTER · v1.0</div>

</div>

<script>
const filters = [
  { name:"Original",      css:"none" },
  { name:"CCD",           css:"contrast(1.2) saturate(1.1) brightness(1.05)" },
  { name:"Y2K",            css:"contrast(1.3) saturate(1.4) hue-rotate(-10deg)" },
  { name:"Vintage",        css:"sepia(0.45) contrast(1.1) brightness(1.05)" },
  { name:"Film",           css:"contrast(1.25) saturate(0.9)" },
  { name:"Warm",           css:"sepia(0.25) saturate(1.4)" },
  { name:"Cool",           css:"hue-rotate(20deg) saturate(1.2)" },
  { name:"Dream",          css:"brightness(1.1) contrast(0.9) blur(1px)" },
  { name:"Soft",           css:"brightness(1.08) saturate(0.95)" },
  { name:"Flash",          css:"brightness(1.3) contrast(1.4)" },
  { name:"B & W",          css:"grayscale(100%) contrast(1.2)" }
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const emptyState = document.getElementById('emptyState');
const hud = document.getElementById('hud');
const modeName = document.getElementById('modeName');
const stampEl = document.getElementById('stamp');
const filenameEl = document.getElementById('filename');
const downloadBtn = document.getElementById('downloadBtn');
const dial = document.getElementById('dial');

let img = new Image();
let hasImage = false;
let activeFilter = filters[0];

function randomStamp(){
  const months = ["01","02","03","04","05","06","07","08","09","10","11","12"];
  const yr = 96 + Math.floor(Math.random()*4);
  const mo = months[Math.floor(Math.random()*12)];
  const day = String(1 + Math.floor(Math.random()*28)).padStart(2,'0');
  const hh = String(Math.floor(Math.random()*24)).padStart(2,'0');
  const mm = String(Math.floor(Math.random()*60)).padStart(2,'0');
  return `'${yr} ${mo}·${day} ${hh}:${mm}`;
}

function render(){
  if(!hasImage) return;
  const w = img.naturalWidth, h = img.naturalHeight;
  canvas.width = w;
  canvas.height = h;
  ctx.filter = activeFilter.css;
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img, 0, 0, w, h);
}

document.getElementById('loadBtn').onclick = () => {
  document.getElementById('upload').click();
};

document.getElementById('upload').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  img.onload = () => {
    hasImage = true;
    emptyState.style.display = 'none';
    canvas.style.display = 'block';
    hud.style.display = 'block';
    downloadBtn.disabled = false;
    stampEl.textContent = randomStamp();
    filenameEl.textContent = file.name;
    render();
  };
  img.src = url;
};

filters.forEach((f, i) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="num">${String(i).padStart(2,'0')}</span>${f.name}`;
  if(i === 0) btn.classList.add('active');
  btn.onclick = () => {
    dial.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = f;
    modeName.textContent = f.name.toUpperCase();
    render();
  };
  dial.appendChild(btn);
});

downloadBtn.onclick = () => {
  if(!hasImage) return;
  const link = document.createElement('a');
  link.download = `digicam-${activeFilter.name.toLowerCase().replace(/\s+/g,'-')}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
};
</script>

</body>
</html>
